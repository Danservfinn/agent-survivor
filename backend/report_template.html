<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPORT_TITLE__</title>
<meta name="description" content="After-action report and benchmark results for one LLM Survivor season: scores, votes, challenges, promises and the jury.">
<style>
:root {
  color-scheme: light;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f3f8;
  --ink: #121a33;
  --ink-2: #47506a;
  --muted: #79829a;
  --line: #e2e5ee;
  --accent: #2f4fe8;
  --accent-ink: #ffffff;
  --good: #0ca30c;
  --critical: #d03b3b;
  --warn-bg: #fff6dd;
  --warn-line: #e8c765;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --shadow: 0 1px 2px rgba(18, 26, 51, .05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1117; --surface: #161a23; --surface-2: #1d222d; --ink: #eceef5; --ink-2: #b8bfd0;
    --muted: #8690a6; --line: #2a3040; --accent: #7d95ff; --accent-ink: #0e1117;
    --good: #0ca30c; --critical: #e66767; --warn-bg: #2c2613; --warn-line: #6d5a1c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1117; --surface: #161a23; --surface-2: #1d222d; --ink: #eceef5; --ink-2: #b8bfd0;
  --muted: #8690a6; --line: #2a3040; --accent: #7d95ff; --accent-ink: #0e1117;
  --good: #0ca30c; --critical: #e66767; --warn-bg: #2c2613; --warn-line: #6d5a1c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 900px) { .wrap { padding: 0 40px; } }
.mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; height: 52px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.top nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.top nav a { text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.top nav a:hover { background: var(--surface-2); color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn-solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
@media (max-width: 760px) { .top nav { display: none; } .top-in { justify-content: space-between; } }

/* hero */
.hero { padding: 44px 0 28px; }
.kicker { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.hero-grid { display: grid; gap: 20px 56px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 980px) { .hero-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
h1 { font: 400 clamp(32px, 5vw, 52px)/1.08 var(--serif); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.hero-sub { color: var(--ink-2); font-size: 16px; margin: 0 0 12px; max-width: 62ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 12px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; color: var(--ink-2); }
.banner { margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; font-size: 14px; }
.banner strong { font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card-pad { padding: 20px; }

/* elimination timeline */
.tl { margin-top: 28px; padding: 20px 24px 18px; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.tl-label { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.tl-winner { font: 700 15px var(--mono); color: var(--accent); text-align: right; }
.tl-scroll { overflow-x: auto; padding-bottom: 4px; }
.tl-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(104px, 1fr); position: relative; min-width: min-content; }
.tl-track::before { content: ""; position: absolute; left: 6px; right: 6px; top: 23px; height: 2px; background: var(--accent); }
.tl-stop { position: relative; padding-right: 10px; }
.tl-stop .r { font: 11px var(--mono); color: var(--muted); height: 16px; }
.tl-stop .pt { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 1px 0 8px; position: relative; }
.tl-stop.end .pt { background: var(--surface); border: 3px solid var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 18%, transparent); }
.tl-stop .who { font-size: 13px; font-weight: 600; line-height: 1.25; }
.tl-stop .how { font: 11px var(--mono); color: var(--muted); }
.updated { font-size: 13px; color: var(--ink-2); margin: 12px 0 0; }

/* takeaway cards */
.takes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 28px 0 0; }
.take { padding: 16px; }
.pill { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.take p { margin: 0; color: var(--ink-2); font-size: 14.5px; }

/* sections */
section.sec { padding: 44px 0 8px; border-top: 1px solid var(--line); margin-top: 44px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 4px; }
.sec-n { font: 12px var(--mono); color: var(--muted); }
h2 { font: 700 21px/1.2 var(--sans); letter-spacing: -.01em; margin: 0; }
.sec-sub { color: var(--ink-2); margin: 0 0 18px; max-width: 70ch; }
h3 { font: 700 15px/1.3 var(--sans); margin: 0 0 4px; }
.card-sub { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; max-width: 68ch; }
.src { font: 11px var(--mono); color: var(--muted); margin: 14px 0 0; }
.foot { font: 12px/1.6 var(--mono); color: var(--muted); margin: 12px 0 0; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 220px; max-width: 420px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.chip { font: 12.5px var(--mono); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip:focus-visible, .btn:focus-visible, .search:focus-visible, th button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips-label { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-right: 4px; }

/* leaderboard */
.tbl-wrap { overflow-x: auto; }
table.lb { border-collapse: collapse; width: 100%; font-size: 14px; }
.lb th, .lb td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.lb thead th { background: var(--surface-2); font-weight: 600; font-size: 12px; line-height: 1.3; color: var(--ink); vertical-align: bottom; white-space: normal; min-width: 84px; }
.lb thead tr.grp th { font-size: 12px; color: var(--ink-2); border-bottom: none; padding-bottom: 2px; text-align: left; }
.lb thead tr.grp th + th, .lb thead tr.cols th.gstart, .lb td.gstart { border-left: 1px solid var(--line); }
.lb th.name, .lb td.name { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 210px; }
.lb thead th.name { background: var(--surface-2); }
.lb th button { all: unset; cursor: pointer; display: inline-flex; gap: 5px; align-items: baseline; }
.lb th .unit { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.lb th .arr { color: var(--muted); font-size: 10px; width: 8px; }
.lb th[aria-sort] .arr { color: var(--accent); }
.lb tbody tr.row { cursor: pointer; }
.lb tbody tr.row:hover td { background-color: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.lb td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lb td.idx { font-weight: 700; font-size: 15px; }
.lb tr:last-child td { border-bottom: none; }
.who { display: flex; align-items: center; gap: 10px; }
.caret { color: var(--muted); font-size: 10px; width: 10px; transition: transform .15s; }
tr.open .caret { transform: rotate(90deg); }
.mono-badge { width: 26px; height: 26px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font: 700 11px var(--mono); color: var(--ink-2); flex: none; }
.who .m { font-weight: 600; }
.who .a { color: var(--muted); font-size: 12.5px; }
.badge { font: 11px var(--mono); border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; margin-left: 6px; color: var(--good); }
.lb td.detail { text-align: left; white-space: normal; background: var(--surface-2); padding: 16px 16px 18px 48px; position: static; }
.detail-grid { display: grid; gap: 18px 32px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--mono); text-align: right; }
table.mini { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.mini th, .mini td { padding: 4px 8px 4px 0; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mini th { font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.yes { color: var(--good); font-weight: 700; }
.no { color: var(--muted); }

/* insight grid */
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.grid2 > * { min-width: 0; }
@media (max-width: 600px) {
  .lb th.name, .lb td.name { min-width: 150px; }
  .lb .mono-badge { display: none; }
  .bar-row { grid-template-columns: minmax(72px, 34%) 1fr 44px; gap: 8px; }
  .card-pad { padding: 16px; }
}
@media (min-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } .span2 { grid-column: 1 / -1; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 168px) 1fr 54px; gap: 12px; align-items: center; font-size: 13px; }
.bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .val { font-family: var(--mono); text-align: right; font-size: 12.5px; }
.track { display: flex; gap: 2px; height: 16px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.track span { display: block; height: 100%; min-width: 2px; }
.track span:last-child { border-radius: 0 4px 4px 0; }
.track.single span { border-radius: 4px; background: var(--s1); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg text.lbl { font-family: var(--sans); font-size: 12px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px; border: 1px dashed var(--line); border-radius: 8px; }

/* heat grids */
.heat-wrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; }
.heat th { font-weight: 500; color: var(--ink-2); text-align: left; padding: 0 10px 0 0; white-space: nowrap; }
.heat thead th { text-align: center; padding: 0 0 4px; font: 11px var(--mono); color: var(--muted); vertical-align: bottom; }
.heat thead th.vert span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font: 500 12px var(--sans); color: var(--ink-2); max-height: 150px; overflow: hidden; text-overflow: ellipsis; }
.heat td { width: 40px; min-width: 40px; height: 32px; text-align: center; border-radius: 4px; font: 12px var(--mono); background: var(--surface-2); }
.heat td.off { background: transparent; }
.heat td.self { background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, transparent 4px 8px); }
.heat td.imm { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat td.out { box-shadow: inset 0 -3px 0 var(--critical); }

/* rounds */
details.round { margin-bottom: 12px; }
details.round > summary, details.acc > summary { list-style: none; cursor: pointer; padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
details > summary::-webkit-details-marker { display: none; }
details.round > summary::before, details.acc > summary::before { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; transition: transform .15s; display: inline-block; }
details[open] > summary::before { transform: rotate(90deg); }
.round-t { font-weight: 700; }
.round-s { color: var(--ink-2); font-size: 14px; }
.round-m { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.round-b { padding: 4px 20px 20px; display: grid; gap: 22px 32px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); border-top: 1px solid var(--line); padding-top: 18px; }
.sub-l { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.rungs { display: inline-flex; gap: 3px; vertical-align: middle; }
.rungs i { width: 13px; height: 13px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: inline-block; }
.rungs i.ok { background: var(--s1); border-color: var(--s1); }
.ch-row { display: grid; grid-template-columns: minmax(90px, 1fr) auto 34px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.ch-row .sc { font-family: var(--mono); text-align: right; }
.vote { font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.vote:last-child { border-bottom: none; }
.vote b { font-weight: 600; }
.alias { color: var(--muted); font-weight: 400; }
.vote .arrow { color: var(--muted); margin: 0 6px; }
.vote .why { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.note { font-size: 13px; margin: 0 0 8px; color: var(--ink-2); }
.note b { color: var(--ink); font-weight: 600; }
blockquote { margin: 0 0 10px; padding: 2px 0 2px 12px; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 13px; }
details.talks { grid-column: 1 / -1; font-size: 13px; }
details.talks summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.talk { padding: 8px 0; border-bottom: 1px solid var(--line); }
.talk p { margin: 2px 0; }

/* finale */
.fin-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 16px; }
.fin .n { font: 700 34px/1 var(--mono); }
.fin .nm { font-weight: 700; margin: 2px 0 8px; }
.fin p { font-size: 13px; color: var(--ink-2); margin: 0; }

details.acc { border-bottom: 1px solid var(--line); }
details.acc > summary { padding: 13px 0; font-weight: 600; }
details.acc > div { padding: 0 0 14px 22px; color: var(--ink-2); font-size: 14px; max-width: 80ch; }

footer { margin-top: 56px; border-top: 1px solid var(--line); padding: 28px 0 56px; color: var(--ink-2); font-size: 13px; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 20px 24px; margin-bottom: 24px; }
.cta p { margin: 0; font-size: 15px; color: var(--ink); max-width: 62ch; }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 7px 10px; border-radius: 7px; max-width: 280px; white-space: pre-line; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
[data-tip] { cursor: default; }
@media print { .top, .controls, .btn { display: none !important; } body { background: #fff; } details > * { display: block !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip" role="tooltip"></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
(function () {
"use strict";
var D = JSON.parse(document.getElementById("report-data").textContent);
var S = D.season, M = D.models, NAMES = D.names || {}, ALIAS = D.aliases || {}, LINKS = D.links || {};
var byId = {}; M.forEach(function (m) { byId[m.agent_id] = m; });
var COMP = Object.keys(S.weights);
var COMP_COLOR = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];
var SVGNS = "http://www.w3.org/2000/svg";
/* ?theme=light or ?theme=dark pins the colors, e.g. for a screenshot; default follows the system */
var wanted = /[?&]theme=(light|dark)\b/.exec(location.search);
if (wanted) document.documentElement.setAttribute("data-theme", wanted[1]);

/* every value from the report goes in through textContent or setAttribute, never innerHTML:
   speeches, vote reasons and model names are model-written text */
function add(node, kids) {
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i];
    if (k == null || k === false) continue;
    if (Array.isArray(k)) add(node, k);
    else node.appendChild(typeof k === "object" ? k : document.createTextNode(String(k)));
  }
  return node;
}
function mk(ns, tag, attrs, kids) {
  var node = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (var key in attrs || {}) {
    var v = attrs[key];
    if (v == null || v === false) continue;
    if (key === "text") node.textContent = v;
    else if (key.slice(0, 2) === "on") node.addEventListener(key.slice(2), v);
    else node.setAttribute(key, v === true ? "" : v);
  }
  return add(node, kids);
}
function h(tag, attrs) { return mk(null, tag, attrs, [].slice.call(arguments, 2)); }
function s(tag, attrs) { return mk(SVGNS, tag, attrs, [].slice.call(arguments, 2)); }

function nm(id) { return id === "host" ? "Host" : (NAMES[id] || id || "nobody"); }
function who(id) {
  var alias = ALIAS[id];
  return alias ? [nm(id), h("span", { class: "alias", text: " (" + alias + ")" })] : nm(id);
}
function f1(x) { return x == null ? "–" : Number(x).toFixed(1); }
function pct(x) { return x == null ? "–" : Math.round(x * 100) + "%"; }
function frac(a, b) { return b ? a + "/" + b : "–"; }
function usd(x) { return x == null ? "–" : "$" + (x >= 1 ? x.toFixed(2) : x >= 0.01 ? x.toFixed(3) : x.toFixed(4)); }
function initials(name) {
  var parts = String(name).replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  return ((parts[0] || "?")[0] + ((parts[1] || parts[0] || "")[parts[1] ? 0 : 1] || "")).toUpperCase();
}
function mix(color, share) { return "color-mix(in srgb, " + color + " " + Math.round(share * 100) + "%, var(--surface-2))"; }
function sourceLine() { return h("p", { class: "src", text: "Source: LLM Survivor season " + (S.date || S.season_id) + (LINKS.site ? " · " + LINKS.site.replace(/^https?:\/\//, "") : "") }); }
function section(id, n, title, sub) {
  return h("section", { class: "sec", id: id },
    h("div", { class: "sec-h" }, h("span", { class: "sec-n", text: n }), h("h2", { text: title })),
    sub ? h("p", { class: "sec-sub", text: sub }) : null);
}

/* ---------- tooltip */
var tip = document.getElementById("tip");
document.addEventListener("mousemove", function (e) {
  var el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!el) { tip.className = ""; return; }
  tip.textContent = el.getAttribute("data-tip");
  tip.className = "on";
  var w = tip.offsetWidth, ht = tip.offsetHeight;
