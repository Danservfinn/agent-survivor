<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPORT_TITLE__</title>
__REPORT_HEAD__
<meta name="description" content="After-action report and benchmark results for one LLM Survivor season: scores, votes, challenges, promises and the jury.">
<style>
/* Theme cloned from LiveBench 2.0 (livebench.ai): its tokens, type scale, table, chips, cards and chart
   conventions. LiveBench ships one light theme, so this page is light by default whatever the system
   setting; ?theme=dark switches to a dark set built on the same hues. */
:root {
  color-scheme: light;
  --ground: #f6f8fc;
  --surface: #fff;
  --surface-2: #fbfcfe;
  --ink: #14213d;
  --muted: #5a6b85;
  --faint: #8a99b5;
  --accent: #2f54eb;
  --accent-rgb: 47, 84, 235;
  --accent-soft: #eaf0ff;
  --row-hover: #f3f6ff;
  --live: #12b886;
  --live-rgb: 18, 185, 134;
  --danger: #c0392b;
  --border: #e4e9f2;
  --border-strong: #d4dbea;
  --radius: 10px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 3px #14213d0f;
  --shadow-md: 0 6px 24px #14213d14;
  --nav-bg: #f6f8fcdb;
  --warn-bg: #fff8e6;
  --warn-line: #f0d488;
  --on-accent: #fff;
  --tip-bg: #14213d;
  --tip-ink: #fff;
  --p1: #2f54eb; --p2: #12b886; --p3: #f59e0b; --p4: #ec4899; --p5: #7c3aed;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1522; --surface: #161d2e; --surface-2: #1a2236; --ink: #e8edf7; --muted: #a3b0c7; --faint: #75839d;
  --accent: #6f8dff; --accent-rgb: 111, 141, 255; --accent-soft: #1d2a4d; --row-hover: #1b2540;
  --live: #2bd4a0; --live-rgb: 43, 212, 160; --danger: #ff7b6b; --border: #27314a; --border-strong: #36425f;
  --shadow-sm: none; --shadow-md: 0 6px 24px #0008; --nav-bg: #0f1522db; --warn-bg: #2b2412; --warn-line: #6b5a1f;
  --on-accent: #0f1522; --tip-bg: #e8edf7; --tip-ink: #14213d;
  --p1: #6f8dff; --p2: #2bd4a0; --p3: #f5b041; --p4: #f472b6; --p5: #a78bfa;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 22px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* nav */
.top { position: sticky; top: 0; z-index: 50; background: var(--nav-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; gap: 20px; padding-top: 11px; padding-bottom: 11px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.brand .sub { font-weight: 800; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(var(--live-rgb), .5); } 70% { box-shadow: 0 0 0 7px rgba(var(--live-rgb), 0); } to { box-shadow: 0 0 0 0 rgba(var(--live-rgb), 0); } }
.top nav { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.top nav a, .btn { background: none; border: none; border-radius: 7px; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 500; padding: 6px 11px; transition: .15s; white-space: nowrap; }
.top nav a:hover, .btn:hover { background: var(--accent-soft); color: var(--ink); }
.btn-solid { background: var(--accent); border: 1px solid var(--accent); border-radius: 999px; color: var(--on-accent); font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 6px 16px; display: inline-block; }
.btn-solid:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.08); }
a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* hero */
.hero { padding: 46px 0 28px; border-bottom: 1px solid var(--border); }
.kicker { color: var(--accent); font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 14px; }
h1 { font-size: clamp(28px, 4.6vw, 44px); font-weight: 800; letter-spacing: -.025em; line-height: 1.06; margin: 0; max-width: 20ch; text-wrap: balance; }
.hero-sub { color: var(--muted); font-size: 17px; margin: 16px 0 0; max-width: 62ch; }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.tag { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; color: var(--muted); }
.banner { margin: 22px 0 0; padding: 11px 14px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: var(--radius-sm); font-size: 14px; }
.banner strong { font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-pad { padding: 18px 20px; }

/* timeline */
.tl { margin-top: 28px; padding: 20px 24px 16px; }
.tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 18px; }
.tl-label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tl-winner { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--accent); text-align: right; }
.tl-scroll { overflow-x: auto; padding: 5px 6px 4px; }
.tl-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(108px, 1fr); position: relative; min-width: min-content; }
.tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 22px; height: 2px; border-radius: 2px; background: var(--accent); }
.tl-stop { position: relative; padding-right: 12px; }
.tl-stop .r { font-family: var(--mono); font-size: 11px; color: var(--faint); height: 16px; }
.tl-stop .pt { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--accent); margin: 0 0 9px; position: relative; }
.tl-stop.end .r { color: var(--live); font-weight: 700; }
.tl-stop.end .pt { background: var(--surface); border-color: var(--live); box-shadow: 0 0 0 4px rgba(var(--live-rgb), .18); }
.tl-stop .who { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.tl-stop .how { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.updated { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }

/* headline tiles */
.takes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin: 26px 0 0; }
.take { padding: 16px; }
.take .k-lab { color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; }
.take .k-val { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; margin-top: 7px; overflow-wrap: anywhere; }
.take .k-sub { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 6px 0 0; }
.take.hl { border-color: var(--live); }
.take.hl .k-val { color: var(--live); }

/* sections */
section.sec { padding: 42px 0; border-bottom: 1px solid var(--border); }
.sec-h { display: flex; align-items: baseline; gap: 13px; margin-bottom: 6px; }
.sec-n { color: var(--faint); font-family: var(--mono); font-size: 13px; }
h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.sec-sub { color: var(--muted); font-size: 15px; margin: 6px 0 0; max-width: 74ch; }
.sec-sub + .card, .sec-sub + .empty { margin-top: 24px; }
h3 { font-size: 15px; font-weight: 700; margin: 0 0 3px; }
.card-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; max-width: 74ch; }
.attrib { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 14px; padding: 8px 12px; background: var(--accent-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); font-size: 12.5px; }
.attrib b { color: var(--ink); letter-spacing: -.01em; }
.attrib .url { color: var(--accent); font-family: var(--mono); font-size: 11.5px; margin-left: auto; }
.foot { color: var(--faint); font-family: var(--mono); font-size: 11.5px; margin: 10px 0 0; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 24px 0 12px; }
.card .controls { margin: 0 0 12px; gap: 7px; }
.search { flex: 1 1 220px; min-width: 170px; max-width: 520px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--ink); font-size: 14px; padding: 9px 12px; }
.search:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }
.chip { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 12px; padding: 7px 13px; transition: .15s; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
select.chip { max-width: 230px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; flex: none; }

/* leaderboard */
.tbl-wrap { overflow: auto; max-height: 82vh; }
table.lb { border-collapse: collapse; font-size: 13.5px; min-width: 100%; width: max-content; }
.lb thead th { background: var(--surface); color: var(--muted); font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; line-height: 1.25; text-transform: uppercase; text-align: right; padding: 12px 9px; white-space: normal; max-width: 100px; vertical-align: bottom; position: sticky; z-index: 3; }
.lb thead tr.grp th { top: 0; height: 33px; padding: 11px 11px 0; text-align: left; color: var(--faint); max-width: none; }
.lb thead tr.cols th { top: 33px; border-bottom: 1px solid var(--border-strong); }
.lb thead tr.single th { top: 0; }
.lb thead th.gstart, .lb thead tr.grp th + th, .lb td.gstart { border-left: 1px solid var(--border); }
.lb thead th.name { text-align: left; left: 0; z-index: 5; max-width: none; }
.lb th button { all: unset; cursor: pointer; display: inline-flex; gap: 3px; align-items: flex-end; justify-content: flex-end; text-align: right; }
.lb th button:hover { color: var(--accent); }
.lb th .unit { display: block; font-weight: 400; color: var(--faint); letter-spacing: 0; text-transform: none; }
.lb th .arr { color: var(--faint); font-size: 9px; flex: none; }
.lb th[aria-sort] .arr { color: var(--accent); }
.lb tbody td { border-bottom: 1px solid var(--border); font-family: var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; padding: 10px 9px; text-align: right; white-space: nowrap; }
.lb tbody tr:last-child td { border-bottom: none; }
.lb td.name { font-family: var(--sans); text-align: left; position: sticky; left: 0; z-index: 2; background: var(--surface); box-shadow: inset -1px 0 0 var(--border); }
.lb tbody tr.row { cursor: pointer; }
.lb tbody tr.row:hover td { background-color: var(--row-hover); }
.lb td.idx { color: var(--ink); font-size: 14px; font-weight: 700; }
.lb td.na { color: var(--faint); }
.who { display: flex; align-items: center; gap: 8px; }
.caret { color: var(--muted); display: inline-block; font-size: 14px; width: 14px; transition: .15s; flex: none; }
tr.open .caret { color: var(--accent); transform: rotate(90deg); }
.rk { color: var(--faint); font-family: var(--mono); font-size: 12px; width: 18px; flex: none; }
.mdot { border-radius: 50%; display: inline-block; flex: none; width: 9px; height: 9px; }
.who .m { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.who .a { color: var(--faint); font-size: 11.5px; }
.badge { border: 1px solid var(--live); border-radius: 4px; color: var(--live); font-family: var(--mono); font-size: 9.5px; font-weight: 400; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.lb td.detail { background: var(--surface-2); padding: 16px 18px 18px; text-align: left; white-space: normal; font-family: var(--sans); }
.detail-grid { display: grid; gap: 14px 32px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.kv { margin: 0; font-size: 12px; }
.kv > div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--border); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-weight: 600; text-align: right; }
table.mini { border-collapse: collapse; font-size: 12px; width: 100%; }
.mini th, .mini td { padding: 4px 10px 4px 0; text-align: left; border-bottom: 1px dotted var(--border); white-space: nowrap; }
.mini th { color: var(--muted); font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.yes { color: var(--live); font-weight: 700; }
.no { color: var(--faint); }

/* insights */
.grid2 { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); margin-top: 24px; }
.grid2 > * { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 15px; color: var(--muted); font-family: var(--mono); font-size: 11.5px; margin: 0 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.bars { display: grid; gap: 0; }
.bar-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 4px 0; }
.bar-row .lab { display: flex; align-items: center; gap: 7px; flex: 0 0 150px; overflow: hidden; white-space: nowrap; }
.bar-row .lab span:last-child { overflow: hidden; text-overflow: ellipsis; }
.bar-row .val { flex: 0 0 62px; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.track { display: flex; gap: 2px; flex: 1 1 0; height: 16px; background: var(--ground); border-radius: 5px; overflow: hidden; }
.track span { display: block; height: 100%; min-width: 2px; }
.track.single span { border-radius: 5px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--faint); }
svg text.lbl { font-family: var(--sans); font-size: 12px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.grid-line { stroke: var(--border); stroke-width: 1; }
.empty { color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 26px 16px; text-align: center; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }

/* heat grids */
.heat-wrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; }
.heat th { font-weight: 600; font-size: 12.5px; color: var(--ink); text-align: left; padding: 0 10px 0 0; white-space: nowrap; }
.heat thead th { text-align: center; padding: 0 0 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; }
.heat thead th.vert span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); max-height: 150px; overflow: hidden; text-overflow: ellipsis; }
.heat td { width: 40px; min-width: 40px; height: 32px; text-align: center; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; background: var(--ground); }
.heat td.off { background: transparent; }
.heat td.self { background: repeating-linear-gradient(135deg, var(--ground) 0 4px, transparent 4px 8px); }
.heat td.imm { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat td.out { box-shadow: inset 0 -3px 0 var(--danger); }

/* rounds */
.rounds-list { display: grid; gap: 12px; }
details.round > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
details > summary::-webkit-details-marker { display: none; }
details.round > summary::before { content: "▸"; color: var(--muted); font-size: 14px; width: 14px; transition: .15s; display: inline-block; }
details.round[open] > summary::before { color: var(--accent); transform: rotate(90deg); }
details.round > summary:hover { background: var(--row-hover); border-radius: var(--radius); }
.round-t { font-family: var(--mono); font-size: 13.5px; font-weight: 700; }
.round-s { font-size: 13.5px; font-weight: 600; }
.round-m { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.round-b { padding: 16px 18px 18px; display: grid; gap: 20px 32px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.sub-l { color: var(--accent); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 7px; }
.rungs { display: inline-flex; gap: 3px; vertical-align: middle; }
.rungs i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface); border: 1px solid var(--border-strong); display: inline-block; }
.rungs i.ok { background: var(--accent); border-color: var(--accent); }
.ch-row { display: grid; grid-template-columns: minmax(90px, 1fr) auto 34px; gap: 10px; align-items: center; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dotted var(--border); }
.ch-row .sc { font-family: var(--mono); font-weight: 600; text-align: right; }
.vote { font-size: 12.5px; padding: 6px 0; border-bottom: 1px dotted var(--border); }
.vote:last-child { border-bottom: none; }
.vote b { font-weight: 600; }
.alias { color: var(--faint); font-weight: 400; }
.vote .arrow { color: var(--faint); margin: 0 6px; }
.vote .why { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.note { font-size: 12.5px; margin: 0 0 8px; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }
blockquote { margin: 0 0 10px; padding: 2px 0 2px 10px; border-left: 2px solid var(--border); color: var(--muted); font-size: 12.5px; }
details.talks { grid-column: 1 / -1; font-size: 12.5px; }
details.talks summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.talk { padding: 8px 0; border-bottom: 1px dotted var(--border); }
.talk p { margin: 2px 0; color: var(--muted); }
.talk p b { color: var(--ink); }

/* finale */
.fin-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 24px 0 18px; }
.fin .k-lab { color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; }
.fin .n { font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin-top: 7px; }
.fin .nm { font-size: 14px; font-weight: 700; margin: 2px 0 8px; }
.fin p { font-size: 12.5px; color: var(--muted); margin: 0; }
.fin.hl { border-color: var(--live); }
.fin.hl .n { color: var(--live); }

/* method */
.terms { list-style: none; margin: 0; padding: 0; }
.terms li { display: grid; gap: 16px; grid-template-columns: 200px minmax(0, 1fr); border-top: 1px solid var(--border); line-height: 1.6; padding: 12px 0; font-size: 14px; }
.terms li:first-child { border-top: 0; padding-top: 2px; }
.terms li:last-child { padding-bottom: 2px; }
.terms li b { font-weight: 600; }
.terms li span { color: var(--muted); max-width: 88ch; }
.meth-head { margin: 34px 0 12px; }
.meth-head.first { margin-top: 24px; }

footer { color: var(--faint); font-size: 13px; padding: 34px 0 60px; }
footer p { margin: 0; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 18px 20px; margin-bottom: 22px; }
.cta p { margin: 0; font-size: 15px; color: var(--ink); max-width: 62ch; }

#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; line-height: 1.35; padding: 9px 11px; border-radius: 8px; box-shadow: var(--shadow-md); max-width: 280px; white-space: pre-line; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
[data-tip] { cursor: default; }

/* moments, players and sharing */
.k-lab { color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; }
.k-val { font-family: var(--mono); font-weight: 700; letter-spacing: -.01em; }
.moment-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
.moment, .player { display: flex; flex-direction: column; scroll-margin-top: 70px; min-width: 0; }
